
name: crypto-market-data-prod

services:
  postgres:
    image: postgres:17-alpine
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-crypto_market_data}
      POSTGRES_USER: ${DATABASE_USER:-crypto_app}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7-alpine
    env_file:
      - .env.production
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$${REDIS_PASSWORD}"
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: crypto-market-data-platform:latest
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: crypto-market-data-platform:latest
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:8000/api/v1/health
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    init: true
    networks:
      - backend

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: crypto-market-data-platform:latest
    env_file:
      - .env.production
    command:
      - python
      - -m
      - app.workers.market_data_worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
